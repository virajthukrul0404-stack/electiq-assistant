<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ElectIQ chatbot and voice preview</title>
  <desc id="desc">A floating AI chat window with message bubbles, persona selector, microphone state, and offline election answer fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620">
      <stop stop-color="#060b17"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <rect x="84" y="80" width="600" height="128" rx="28" fill="rgba(255,255,255,.04)" stroke="rgba(148,163,184,.16)"/>
  <text x="124" y="132" fill="#f8fafc" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="800">Ask neutral civic questions</text>
  <text x="124" y="172" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">Gemini-ready, with built-in election answers when no key is available.</text>
  <rect x="104" y="260" width="238" height="70" rx="35" fill="rgba(59,130,246,.12)" stroke="rgba(59,130,246,.35)"/>
  <text x="138" y="303" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">What is NOTA?</text>
  <rect x="104" y="356" width="332" height="70" rx="35" fill="rgba(255,255,255,.05)" stroke="rgba(148,163,184,.18)"/>
  <text x="138" y="399" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">How are votes counted?</text>
  <rect x="104" y="452" width="416" height="70" rx="35" fill="rgba(255,255,255,.05)" stroke="rgba(148,163,184,.18)"/>
  <text x="138" y="495" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Explain voter registration</text>
  <rect x="708" y="54" width="404" height="512" rx="34" fill="rgba(15,23,42,.92)" stroke="rgba(148,163,184,.22)"/>
  <text x="746" y="112" fill="#f8fafc" font-family="Space Grotesk, Arial, sans-serif" font-size="28" font-weight="800">ElectIQ AI Assistant</text>
  <rect x="934" y="78" width="132" height="48" rx="24" fill="rgba(255,255,255,.04)" stroke="rgba(148,163,184,.16)"/>
  <text x="965" y="109" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Professor</text>
  <text x="746" y="152" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Voice-ready, non-partisan election help.</text>
  <rect x="746" y="190" width="246" height="82" rx="24" fill="url(#blue)"/>
  <text x="774" y="226" fill="white" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">What is NOTA?</text>
  <text x="774" y="254" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="15">User question</text>
  <rect x="746" y="300" width="318" height="142" rx="24" fill="rgba(255,255,255,.045)" stroke="rgba(148,163,184,.14)"/>
  <text x="774" y="342" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">NOTA means None of the Above.</text>
  <text x="774" y="376" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">It lets a voter reject all listed</text>
  <text x="774" y="404" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">candidates while still participating.</text>
  <circle cx="790" cy="492" r="34" fill="#dc2626"/>
  <path d="M790 472v27m-12-15v12a12 12 0 0 0 24 0v-12m-12 28v12m-14 0h28" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <rect x="842" y="462" width="190" height="60" rx="30" fill="rgba(255,255,255,.05)" stroke="rgba(148,163,184,.18)"/>
  <text x="875" y="499" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Voice mode on</text>
  <circle cx="1065" cy="492" r="34" fill="#3b82f6"/>
  <path d="M1054 477l26 15-26 15v-30z" fill="white"/>
</svg>
