<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ElectIQ hero dashboard preview</title>
  <desc id="desc">A premium dark civic-tech landing screen with ElectIQ branding, statistics, countdown, and navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e1a"/>
      <stop offset=".48" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.231 0 0 0 0 0.51 0 0 0 0 0.965 0 0 0 .38 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="960" cy="120" r="220" fill="#3b82f6" opacity=".12"/>
  <circle cx="220" cy="500" r="190" fill="#8b5cf6" opacity=".13"/>
  <rect x="74" y="58" width="1052" height="74" rx="28" fill="rgba(15,23,42,.54)" stroke="rgba(148,163,184,.2)"/>
  <rect x="100" y="78" width="44" height="34" rx="9" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <path d="M111 94l9 9 18-22" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="105" fill="#f8fafc" font-family="Space Grotesk, Arial, sans-serif" font-size="32" font-weight="700">Elect<tspan fill="#3b82f6">IQ</tspan></text>
  <rect x="430" y="75" width="342" height="42" rx="21" fill="rgba(255,255,255,.04)" stroke="rgba(148,163,184,.16)"/>
  <text x="470" y="102" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Timeline</text>
  <text x="570" y="102" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Quiz</text>
  <text x="640" y="102" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Resources</text>
  <rect x="858" y="72" width="190" height="48" rx="24" fill="rgba(59,130,246,.16)" stroke="rgba(59,130,246,.36)"/>
  <text x="900" y="103" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Voice Assistant</text>
  <text x="94" y="238" fill="#f8fafc" font-family="Space Grotesk, Arial, sans-serif" font-size="84" font-weight="800">Elect<tspan fill="#3b82f6">IQ</tspan></text>
  <text x="98" y="293" fill="#dbeafe" font-family="Space Grotesk, Arial, sans-serif" font-size="34" font-weight="600">Your AI Guide to the Democratic Process</text>
  <text x="100" y="344" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="21">Ask neutral election questions, explore Indian election phases,</text>
  <text x="100" y="374" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="21">practice civic knowledge, and learn in plain language.</text>
  <rect x="100" y="420" width="158" height="58" rx="29" fill="url(#accent)" filter="url(#glow)"/>
  <text x="137" y="456" fill="white" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Start Learning</text>
  <rect x="276" y="420" width="118" height="58" rx="29" fill="rgba(255,255,255,.05)" stroke="rgba(148,163,184,.2)"/>
  <text x="316" y="456" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Ask AI</text>
  <rect x="100" y="510" width="470" height="72" rx="24" fill="rgba(255,255,255,.05)" stroke="rgba(148,163,184,.18)"/>
  <text x="132" y="553" fill="#3b82f6" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800">968M</text>
  <text x="246" y="553" fill="#3b82f6" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800">1.05M</text>
  <text x="375" y="553" fill="#3b82f6" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800">67.4%</text>
  <text x="494" y="553" fill="#3b82f6" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="800">24/7</text>
  <rect x="708" y="190" width="390" height="270" rx="32" fill="rgba(255,255,255,.06)" stroke="rgba(148,163,184,.18)"/>
  <circle cx="904" cy="285" r="82" fill="rgba(59,130,246,.13)" stroke="rgba(59,130,246,.26)"/>
  <rect x="862" y="247" width="84" height="70" rx="16" fill="#111827" stroke="#3b82f6" stroke-width="4"/>
  <path d="M882 281l17 17 33-44" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="708" y="392" width="390" height="68" rx="0" fill="rgba(15,23,42,.55)"/>
  <text x="735" y="433" fill="#bfdbfe" font-family="JetBrains Mono, monospace" font-size="18">Polling stations mapped: 1,050,000</text>
  <rect x="708" y="486" width="390" height="92" rx="26" fill="rgba(255,255,255,.07)" stroke="rgba(148,163,184,.18)"/>
  <text x="736" y="525" fill="#f8fafc" font-family="Space Grotesk, Arial, sans-serif" font-size="22" font-weight="700">Election countdown</text>
  <text x="736" y="556" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">Demo state-level election cycle</text>
</svg>
