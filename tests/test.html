<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectIQ Test Suite</title>
  <style>
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 1rem; }
    #summary { font-size: 1.25rem; font-weight: bold; margin: 1.5rem 0; padding: 1rem; border-radius: 6px; }
    .summary-pass { background: rgba(35,134,54,0.15); color: #3fb950; border: 1px solid rgba(35,134,54,0.4); }
    .summary-fail { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid rgba(248,81,73,0.4); }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; }
    th { color: #8b949e; font-weight: 600; }
    .pass { color: #3fb950; font-weight: bold; }
    .fail { color: #f85149; font-weight: bold; }
    .details { font-size: 0.875rem; color: #8b949e; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>ElectIQ Test Suite</h1>
  <div id="summary">Running tests...</div>
  <table>
    <thead>
      <tr>
        <th style="width: 50%;">Test Name</th>
        <th style="width: 15%;">Status</th>
        <th style="width: 35%;">Details</th>
      </tr>
    </thead>
    <tbody id="test-results"></tbody>
  </table>

  <!-- Config & dependencies mock required for tests -->
  <script>
    const ELECTIQ_CONFIG = {
      GEMINI_API_KEY: "TEST_KEY",
      GEMINI_MODEL: "gemini-2.5-flash",
      RATE_LIMIT_MS: 100
    };
  </script>
  <script src="../scripts/gemini.js"></script>
  <script src="../scripts/quiz.js"></script>
  <script src="../scripts/voice.js"></script>

  <script>
    let passed = 0;
    let total = 21;
    const tbody = document.getElementById("test-results");

    function renderTest(name, result, details) {
      if (result) passed++;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${name}</td>
        <td class="${result ? 'pass' : 'fail'}">${result ? 'PASS' : 'FAIL'}</td>
        <td class="details">${details || 'OK'}</td>
      `;
      tbody.appendChild(tr);
    }

    function updateSummary() {
      const summary = document.getElementById("summary");
      summary.textContent = `${passed} / ${total} tests passed`;
      summary.className = passed === total ? "summary-pass" : "summary-fail";
    }

    async function runTests() {
      let data, quizData, timelineData, htmlContent, jsApp, jsChat;

      // 1. Data Fetch
      try {
        const [resData, resQuiz, resTimeline, resHtml, resApp, resChat] = await Promise.all([
          fetch("../data/election-data.json"),
          fetch("../data/quiz.json"),
          fetch("../data/timeline.json"),
          fetch("../index.html"),
          fetch("../scripts/app.js"),
          fetch("../scripts/chat.js")
        ]);
        data = await resData.json();
        quizData = await resQuiz.json();
        timelineData = await resTimeline.json();
        htmlContent = await resHtml.text();
        jsApp = await resApp.text();
        jsChat = await resChat.text();
        renderTest("1. Data files fetch successfully", true, "JSON and Source fetched.");
      } catch (err) {
        renderTest("1. Data files fetch successfully", false, err.message);
      }

      // 2. Quiz Length
      renderTest("2. Quiz contains exactly 10 questions", quizData && quizData.length === 10, "Found " + (quizData?.length || 0));

      // 3. Quiz Structure
      const quizValid = quizData && quizData.every(q => q.question && q.options?.length === 4 && typeof q.correctIndex === "number" && q.explanation);
      renderTest("3. Quiz questions have valid structure", quizValid, "Checked question, options, correctIndex, explanation");

      // 4. Timeline Length
      renderTest("4. Timeline contains exactly 7 phases", timelineData && timelineData.length === 7, "Found " + (timelineData?.length || 0));

      // 5. Timeline Structure
      const timelineValid = timelineData && timelineData.every(p => p.id && p.title && p.description && p.badge);
      renderTest("5. Timeline phases have valid structure", timelineValid, "Checked id, title, description, badge");

      // 6. Data Constants
      const hasFaq = data && Array.isArray(data.faqs) && data.faqs.length > 0;
      renderTest("6. election-data.json has FAQs", hasFaq, "FAQs array found");

      // 7. Glossary
      const hasGlossary = data && Array.isArray(data.glossary) && data.glossary.length > 0;
      renderTest("7. election-data.json has Glossary", hasGlossary, "Glossary array found");

      // 8. XSS check
      try {
        const div = document.createElement("div");
        div.textContent = '<script>window.__xss=true</scr' + 'ipt>';
        document.body.appendChild(div);
        renderTest("8. DOM implicitly escapes textContent", window.__xss === undefined, "window.__xss is undefined");
        div.remove();
      } catch (e) {
        renderTest("8. DOM implicitly escapes textContent", false, e.message);
      }

      // 9. Gemini Rate Limit
      try {
        window.ElectIQ.gemini.resetRateLimitForTests();
        const call1 = window.ElectIQ.gemini.canMakeRequest();
        const call2 = window.ElectIQ.gemini.canMakeRequest();
        renderTest("9. Gemini API rate limiter blocks rapid requests", call1 === true && call2 === false, `call1=${call1}, call2=${call2}`);
      } catch (e) {
        renderTest("9. Gemini API rate limiter blocks rapid requests", false, e.message);
      }

      // 10. LocalStorage serialization
      try {
        localStorage.setItem('electiq_chat', JSON.stringify([{role:'user',text:'hi'}]));
        const stored = JSON.parse(localStorage.getItem('electiq_chat'));
        const passedL = stored.length === 1 && stored[0].text === 'hi';
        localStorage.removeItem('electiq_chat');
        renderTest("10. LocalStorage chat serialization valid", passedL, "Parsed correctly");
      } catch (e) {
        renderTest("10. LocalStorage chat serialization valid", false, e.message);
      }

      // 11. CSS Variables exist
      try {
        const root = document.documentElement;
        root.style.setProperty('--font-scale', '1.15');
        const updated = getComputedStyle(root).getPropertyValue('--font-scale').trim() === '1.15';
        root.style.setProperty('--font-scale', '1');
        renderTest("11. CSS variables accessible via JS", updated, "Variables modifiable");
      } catch (e) {
        renderTest("11. CSS variables accessible via JS", false, e.message);
      }

      // 12. Voice API degradation
      try {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          let threw = false;
          try {
            const controller = window.ElectIQ.voice.createVoiceController();
            controller.toggleAlwaysOn();
          } catch(err) { threw = true; }
          renderTest("12. Voice API degrades gracefully", !threw, "Handled safely when unsupported");
        } else {
           renderTest("12. Voice API degrades gracefully", true, "Speech capabilities found");
        }
      } catch (e) {
         renderTest("12. Voice API degrades gracefully", false, e.message);
      }

      // 13. System Prompt structure
      try {
        const payload = window.ElectIQ.gemini.buildRequestPayload([], "hello", "professor");
        const containsElectIq = payload.contents[0].parts[0].text.includes("ElectIQ");
        const roleCorrect = payload.contents[0].role === "user";
        renderTest("13. Gemini system prompt prepended", containsElectIq && roleCorrect, "Role and identity correct");
      } catch(e) {
        renderTest("13. Gemini system prompt prepended", false, e.message);
      }

      // 14. Quiz Math
      try {
        const calculateScore = (c, t) => Math.round((c / t) * 100) || 0;
        const t1 = calculateScore(7, 10) === 70;
        const t2 = calculateScore(10, 10) === 100;
        const t3 = calculateScore(0, 10) === 0;
        renderTest("14. Quiz score math accurate", t1 && t2 && t3, "Tested 7/10, 10/10, 0/10");
      } catch (e) {
        renderTest("14. Quiz score math accurate", false, e.message);
      }

      // 15. Google Services
      try {
        const googleSignals = [
          "googletagmanager.com/gtag/js?id=G-ELECTIQ2026",
          "google_translate_element",
          "google-init.js"
        ];
        const allFound = googleSignals.every(signal => htmlContent.includes(signal));
        renderTest("15. Google services integrations linked", allFound, "GA4, Translate linked");
      } catch (e) {
        renderTest("15. Google services integrations linked", false, e.message);
      }

      // 16. CSP Strict
      try {
        const hasCSP = htmlContent.includes("Content-Security-Policy");
        const hasSelf = htmlContent.includes("default-src 'self'");
        renderTest("16. Strict CSP applied with necessary Google Service exceptions", hasCSP && hasSelf, "CSP is strict but functional");
      } catch (e) {
        renderTest("16. Strict CSP applied with necessary Google Service exceptions", false, e.message);
      }

      // 17. Modular Components Extracted
      try {
        const componentsFound = htmlContent.includes("components/hero.js") && htmlContent.includes("components/quiz-section.js");
        renderTest("17. HTML uses modular component architecture", componentsFound, "Components loaded via scripts");
      } catch(e) {
        renderTest("17. HTML uses modular component architecture", false, e.message);
      }

      // 18. DOMPurify check
      try {
        const usesDomPurify = htmlContent.includes("dompurify");
        renderTest("18. DOMPurify loaded for XSS protection", usesDomPurify, "CDN link found");
      } catch(e) {
        renderTest("18. DOMPurify loaded for XSS protection", false, e.message);
      }

      // 19. Semantic Partials 
      try {
        const isModular = !htmlContent.includes('<div class="hero-copy">') && !htmlContent.includes('<div class="quiz-setup" id="quiz-setup">');
        renderTest("19. Semantic partials effectively replaced monolithic HTML", isModular, "Monolithic markup stripped from index.html");
      } catch(e) {
        renderTest("19. Semantic partials effectively replaced monolithic HTML", false, e.message);
      }

      // 20. Code Modernization (async/await)
      try {
        const hasModern = jsApp.includes("async function") || jsApp.includes("await ");
        renderTest("20. JS uses modern async/await patterns", hasModern, "Found async/await keywords");
      } catch(e) {
        renderTest("20. JS uses modern async/await patterns", false, e.message);
      }

      // 21. Cloud Run Deployment Ready
      try {
        const dockerfile = await (await fetch("../Dockerfile")).text();
        const validDeploy = dockerfile.includes("EXPOSE 8080") && dockerfile.includes("http.server");
        renderTest("21. Dockerfile supports GCP Cloud Run", validDeploy, "Found EXPOSE 8080 and python server");
      } catch (e) {
        renderTest("21. Dockerfile supports GCP Cloud Run", false, e.message);
      }

      updateSummary();
    }

    window.onload = runTests;
  </script>
</body>
</html>
